name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  yaml-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve code
        uses: actions/checkout@v4
      - name: "Linter & Formatter scan of Helm charts"
        run: |
          echo "Starting linting..."
          pip install uv
          uv sync
          echo "Venv initialize, now pre-committing files"
          uv run pre-commit run --all-files
          echo "Pre-commit is over."
