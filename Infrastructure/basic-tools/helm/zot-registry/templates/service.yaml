apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: kube-dev
  labels:
    helm.sh/chart: zot-0.1.130
    app.kubernetes.io/name: zot
    app.kubernetes.io/instance: zot-registry
    app.kubernetes.io/version: "v2.1.23"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.name }}
      protocol: TCP
      name: {{ .Values.service.name }}
  selector:
    app.kubernetes.io/name: zot
    app.kubernetes.io/instance: zot-registry