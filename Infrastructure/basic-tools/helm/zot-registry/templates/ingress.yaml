apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zot
  namespace: kube-dev
  annotations:
    # Tell Traefik which entryPoint to bind to (corresponds to :8000/tcp)
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: registry.homelab.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.service.name }}
            port:
              number: {{ .Values.service.port }}