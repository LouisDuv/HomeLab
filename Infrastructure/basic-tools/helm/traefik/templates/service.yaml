apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: "traefik-{{ .Values.namespace }}"
    helm.sh/chart: traefik-41.7.1
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: "traefik-{{ .Values.namespace }}"
  ports:
  - port: 80
    name: web
    targetPort: web
    protocol: TCP
  - port: 443
    name: websecure
    targetPort: websecure
    protocol: TCP