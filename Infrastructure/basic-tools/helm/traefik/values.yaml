api:
  enabled: true

namespace: kube-system

listeningPort:
  websecure: 443
  web: 80

image:
  repository: docker.io/traefik
  tag: v3.0
  pullPolicy: IfNotPresent

resources:
  cpu: 100m
  memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingressClass:
  enabled: true
  isDefaultClass: true
  name: "ingress-class"
